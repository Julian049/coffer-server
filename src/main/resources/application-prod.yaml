# Render coffer-server + Neon branch "production"; DB_URL, DB_USER, DB_PASSWORD come from Render
logging:
  level:
    root: WARN
    com.dev.julian09.financeserver: INFO
finance:
  jwt:
    # No default: the service refuses to start without its own keys
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
# 2.1 security review: the API schema adds nothing for clients and describes the whole API, so it is off in production (staging keeps it)
springdoc:
  api-docs:
    enabled: false
