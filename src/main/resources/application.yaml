spring:
  application:
    name: coffer-server
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
  threads:
    virtual:
      enabled: true
finance:
  jwt:
    # Empty locally and in tests (temporary pair); staging/prod override them with required env vars
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    access-ttl: PT15M
    refresh-ttl: P180D
  mail:
    # Brevo HTTP API for the password reset code (REQ-AUT-09); empty locally and in tests, where nothing is sent
    brevo-api-key: ${BREVO_API_KEY:}
    from: ${MAIL_FROM:cofferapp1@gmail.com}
  google:
    # Web client id of Google Cloud (REQ-AUT-03); empty locally and in tests, where Google sign-in is refused
    client-id: ${GOOGLE_CLIENT_ID:}
server:
  address: 0.0.0.0
  # Render terminates TLS in front of us; trust its X-Forwarded-For so rate limits see the client IP
  forward-headers-strategy: native
  # Render injects PORT; locally it stays 8080
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      # Contract (openapi.yml) and RNF-07: health answers only {"status": ...}
      show-details: never
      probes:
        enabled: false
