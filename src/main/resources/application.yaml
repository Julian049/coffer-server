spring:
  application:
    name: coffer-server
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
  threads:
    virtual:
      enabled: true
server:
  address: 0.0.0.0
  # Render injects PORT; locally it stays 8080
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
