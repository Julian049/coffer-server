name: Gitleaks

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Free for personal accounts; scans the commits of the PR or push for secrets (S14-H04 follow-up)
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
