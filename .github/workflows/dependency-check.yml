name: Dependency-Check

# The NVD API is slow and unreliable, so this never gates PRs: weekly and on demand only.
# Day-to-day vulnerability alerts come from Dependabot (GitHub Advisory Database).
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Restore NVD database
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      # Fails on CVSS >= 7
      - run: ./mvnw -B -Powasp dependency-check:check -DnvdApiKey=${{ secrets.NVD_API_KEY }}
      # Saved even when vulnerabilities fail the build, so the next run only downloads the delta
      - name: Save NVD database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check
          path: target/dependency-check-report.html
          if-no-files-found: ignore
