services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_finance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_EXTERNAL}:${DB_PORT_INTERNAL}"
    volumes:
      - finance_data:/var/lib/postgresql/data

volumes:
  finance_data: